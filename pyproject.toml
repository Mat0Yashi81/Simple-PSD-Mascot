[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-psd-mascot"
version = "1.0.1"
description = "PSDレイヤーで動くデスクトップマスコット"
authors = [{name = "Mat0Yashi_81"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.7.3", "psd-tools==1.26.0", "Pillow==13.0.0", "numpy==2.5.4"]

[project.scripts]
simple-psd-mascot = "psd_mascot.app:main"

[tool.setuptools.packages.find]
where = ["src"]




[tool.setuptools.package-data]
psd_mascot = ["assets/*.ico", "assets/*.png", "assets/*.json"]
